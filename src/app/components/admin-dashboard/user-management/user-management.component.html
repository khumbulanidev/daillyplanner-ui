<div class="user-management-container">

 



@if(errorMessage){
<div class="error">
  {{errorMessage}}
</div>
}

 
    <div class="button-container">

    <span class="ep--circle-plus btnAddDay" (click)="addRow()"></span>
  </div>

 <p-table  [value]="users" [tableStyle]="{ 'min-width': '70vw', 'max-width':'80vw' }"
      styleClass="p-datatable-gridlines p-datatable-striped" [paginator]="true" [rows]="10"
      [rowsPerPageOptions]="[10, 20, 50, 100]" class="prime-table">
      <ng-template pTemplate="header" >
        <tr>
          <th><input type="checkbox" name="selectAll"  (change)="onAllCheckboxChange($event)"
              [checked]="selectAllCheckBox" /></th>
              <th pSortableColumn="email" style="width:25%">Email<p-sortIcon field="email" /></th>
          <th pSortableColumn="firstname" style="width:15%">firstname <p-sortIcon field="firstname" /></th>
          <th pSortableColumn="lastname" style="width:15%">Lastname <p-sortIcon field="lastname" /></th>
          <th pSortableColumn="phone" style="width:15%">Phone<p-sortIcon field="phone" /></th>
          <th style="width:10%">View</th>
          <!-- <th>Save</th> -->
          <th style="width:10%">Delete</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-user let-rowIndex="rowIndex">
        <tr  >
          <td><input type="checkbox" name="taskCheckbox" [checked]="allCheckboxesChecked" 
              (change)="onSingleCheckboxChange($event, user.value.id, rowIndex)" /></td>
          <td>{{user.email}}  </td>
          <td>{{user.firstname}}</td>
          <td>{{user.lastname}}</td>
          <td>{{user.phone}}</td>
          <td>view</td>
          <td class="center icons"><i class="fa-solid fa-trash delete" (click)="removeRow(rowIndex, user.value.id)"></i> </td>
        </tr>
      </ng-template>
    </p-table>
<div class="button-container">
 @if(isACheckboxChecked && tasksToSave.length > 0){
    <div class="deleteBtnContainer">
       <button class="saveBtn" (click)="saveTasks()">Set days</button></div>
    }

    @if(allCheckboxesChecked || isACheckboxChecked){
    <div class="deleteBtnContainer">
       <button class="deleteBtn" (click)="deleteAll()">Delete All</button></div>
    }

    <div class="deleteBtnContainer">
       <button class="saveBtn" (click)="saveTasks()">Save</button></div>
</div>
    

</div>
